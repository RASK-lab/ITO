<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>判定エンジン 確認ページ</title>
<style>
  body { font-family: system-ui, "Yu Gothic", sans-serif; margin: 16px; color: #1a2130; background: #f5f7fa; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  canvas { background: #fff; border: 1px solid #c9d1dd; border-radius: 8px; touch-action: none; width: 420px; height: 420px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; align-items: center; }
  button { padding: 6px 12px; border-radius: 6px; border: 1px solid #2c4f87; background: #2c4f87; color: #fff; cursor: pointer; }
  button.sub { background: #fff; color: #2c4f87; }
  .panel { background: #fff; border: 1px solid #dbe1ea; border-radius: 8px; padding: 12px 16px; min-width: 300px; max-width: 600px; }
  .sock { font-size: 28px; font-weight: 700; font-family: ui-monospace, Consolas, monospace; }
  .comment { font-size: 16px; line-height: 1.8; background: #fdf8ec; border-left: 4px solid #c9a85a; padding: 8px 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td { padding: 2px 6px; border-bottom: 1px solid #eef1f6; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; width: 60px; }
  .bar { position: relative; height: 8px; background: #eef1f6; border-radius: 4px; }
  .bar span { position: absolute; top: 0; height: 8px; background: #2c4f87; border-radius: 4px; }
  .muted { color: #5a6476; font-size: 13px; }
  details pre { font-size: 11px; max-height: 260px; overflow: auto; background: #eef1f6; padding: 8px; border-radius: 6px; }
  img.sockimg { max-width: 160px; display: block; margin: 6px 0; }
</style>
</head>
<body>
<h1>判定エンジン 確認ページ（開発用）</h1>
<div class="row">
  <div>
    <canvas id="c" width="512" height="512"></canvas>
    <div class="controls">
      <button id="geo">AIなしで判定</button>
      <button id="full">AIで判定</button>
      <button class="sub" id="undo">1画戻す</button>
      <button class="sub" id="clear">消す</button>
    </div>
    <div class="controls">
      <label>書いたつもり
        <select id="intended">
          <option value="">（なし）</option>
          <option value="teinei">丁寧</option><option value="zatsu">雑</option>
          <option value="tappitsu">達筆</option><option value="bukiyou">不器用</option>
          <option value="kawaii">かわいい</option><option value="kakkoii">かっこいい</option>
          <option value="atatakai">温かい</option><option value="tsumetai">冷たい</option>
          <option value="koseiteki">個性的</option><option value="sensai">繊細</option>
        </select>
      </label>
      <label>品質（人の評価） <select id="quality"><option value="">-</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
      <label>名前 <input id="writer" size="8"></label>
      <button class="sub" id="save">サンプル保存</button>
    </div>
    <p class="muted" id="status">マウス・指・ペンで「と」を書いてください。</p>
  </div>
  <div class="panel" id="result"><p class="muted">ここに結果が出ます。</p></div>
</div>

<script>
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const $ = (id) => document.getElementById(id);
let strokes = [], cur = null, t0 = null;
const LABEL = { teinei: "丁寧", zatsu: "雑", tappitsu: "達筆", bukiyou: "不器用", kawaii: "かわいい", kakkoii: "かっこいい",
  atatakai: "温かい", tsumetai: "冷たい", koseiteki: "個性的", sensai: "繊細" };
const AXES = { carefulness: ["丁寧", "雑"], fluency: ["達筆", "不器用"], roundness: ["かわいい", "かっこいい"],
  warmth: ["温かい", "冷たい"], boldness: ["個性的", "繊細"] };

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = "#1a2130"; ctx.lineWidth = 10; ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const st of strokes.concat(cur ? [cur] : [])) {
    ctx.beginPath();
    st.points.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    if (st.points.length === 1) ctx.lineTo(st.points[0][0] + 0.1, st.points[0][1]);
    ctx.stroke();
  }
}
function pt(e) {
  const r = cv.getBoundingClientRect();
  if (t0 === null) t0 = e.timeStamp;
  const sx = cv.width / r.width, sy = cv.height / r.height;
  return [(e.clientX - r.left) * sx, (e.clientY - r.top) * sy, Math.round(e.timeStamp - t0), e.pressure || 0.5];
}
cv.addEventListener("pointerdown", (e) => { cv.setPointerCapture(e.pointerId); cur = { pointerType: e.pointerType || "mouse", points: [pt(e)] }; draw(); });
cv.addEventListener("pointermove", (e) => {
  if (!cur) return;
  for (const ev of (e.getCoalescedEvents ? e.getCoalescedEvents() : [e])) cur.points.push(pt(ev));
  draw();
});
const end = () => { if (cur) { strokes.push(cur); cur = null; draw(); } };
cv.addEventListener("pointerup", end);
cv.addEventListener("pointercancel", end);

const body = () => ({ canvas: { width: cv.width, height: cv.height }, strokes });
async function post(path) {
  if (!strokes.length) { $("status").textContent = "まだ何も書かれていません。"; return null; }
  $("status").textContent = "判定中…";
  const t = performance.now();
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body()) });
  const json = await res.json();
  $("status").textContent = res.ok ? `完了（${strokes.length}画、${Math.round(performance.now() - t)}ms）` : `エラー ${res.status}`;
  return json;
}
function axisRows(axes) {
  return Object.entries(axes).map(([k, v]) => {
    const w = Math.min(Math.abs(v) / 3, 1) * 50, left = v >= 0 ? 50 : 50 - w;
    return `<tr><td>${AXES[k][1]}</td><td style="width:50%"><div class="bar"><span style="left:${left}%;width:${w}%"></span></div></td><td>${AXES[k][0]}</td><td class="n">${v.toFixed(2)}</td></tr>`;
  }).join("");
}
function show(r) {
  if (r.detail) { $("result").innerHTML = `<pre>${JSON.stringify(r, null, 2)}</pre>`; return; }
  const d = r.debug || {};
  const imp = d.impression || {};
  const q = d.quality || {};
  $("result").innerHTML = `
    <div class="muted">靴下ID${r.degraded ? "（AIなし）" : ""}</div>
    <div class="sock">${r.sock_id}</div>
    <img class="sockimg" src="/api/dev/sock-image/${r.sock_id}" onerror="this.remove()">
    <p class="comment">${r.comment}</p>
    <hr>
    <div class="muted">以下はユーザーには見せない内部の評価</div>
    <p>品質: ${q.rank ?? "-"}（${q.score ?? "-"}点、幾何評価 ${q.geometry ?? "-"}） / 印象: <b>${LABEL[imp.id] ?? "-"}</b>（候補: ${(imp.candidates || []).map(c => LABEL[c]).join("・")}）</p>
    ${d.ai_judgement ? `<p class="muted">AIの判断理由: ${d.ai_judgement.impression_reason}</p>` : ""}
    <table>${imp.axes ? axisRows(imp.axes) : ""}</table>
    <p class="muted">誤タップとして除外: ${(d.ignored_strokes || []).join(", ") || "なし"} ／ 時間: ${JSON.stringify(d.timings_ms || {})}</p>
    <details><summary>特徴量</summary><pre>${(d.feature_text || []).join("\n")}</pre></details>
    <details><summary>debug（全部）</summary><pre>${JSON.stringify(d, null, 2)}</pre></details>`;
}
$("geo").onclick = async () => { const r = await post("/api/judge/geometry"); if (r) show(r); };
$("full").onclick = async () => { const r = await post("/api/judge/full"); if (r) show(r); };
$("undo").onclick = () => { strokes.pop(); if (!strokes.length) t0 = null; draw(); };
$("clear").onclick = () => { strokes = []; t0 = null; draw(); $("result").innerHTML = '<p class="muted">ここに結果が出ます。</p>'; };
$("save").onclick = async () => {
  const qs = new URLSearchParams({ intended: $("intended").value, writer: $("writer").value });
  if ($("quality").value) qs.set("quality", $("quality").value);
  const r = await post(`/api/dev/samples?${qs}`);
  if (r && r.saved) { $("status").textContent = `保存しました: ${r.saved}（AIなしの判定: ${r.sock_id_without_ai}）`; strokes = []; t0 = null; draw(); }
};
draw();
</script>
</body>
</html>
