name: ito

services:
  frontend:
    build:
      context: ./front
      dockerfile: ../infra/docker/front.Dockerfile

    ports:
      - "127.0.0.1:5173:5173"

    volumes:
      - ./front:/app
      - frontend_modules:/app/node_modules

    command: >
      sh -c "npm ci && npm run dev"

    depends_on:
      - backend

  backend:
    build:
      context: ./back
      dockerfile: ../infra/docker/back.Dockerfile

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./back/src:/app/src

    command:
      - uvicorn
      - src.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload

volumes:
  frontend_modules:
