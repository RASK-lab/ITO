<!doctype html>
<html lang="ja">
<!--
  ラベル付けの画面（アドレスは /label/）。API は back/src/labeling.py（本番）と
  ml/labeling/server.py（手元）。どちらも同じ /api/label/* の形。くわしくは ml/README.md。
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>「と」のラベル付け</title>
<style>
  :root { font: 16px/1.5 system-ui, sans-serif; color: #222; background: #f4f4f2; }
  body { margin: 0; }
  main { max-width: 560px; margin: 0 auto; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.9rem; }
  header a, header button { color: #555; font: inherit; background: none; border: none; text-decoration: underline; cursor: pointer; padding: 0; }
  h1 { font-size: 1.05rem; margin: 0; text-align: center; }
  .frame { background: #fff; border: 1px solid #ccc; aspect-ratio: 1; display: grid; place-items: center; }
  .frame img { width: 100%; height: 100%; object-fit: contain; image-rendering: auto; }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .buttons button, .sub button { font: inherit; min-height: 3.2rem; border: 1px solid #888; background: #fff; border-radius: 6px; cursor: pointer; }
  .buttons button small { display: block; color: #777; font-size: 0.75rem; }
  .buttons button.chosen, .sub button.chosen { background: #222; color: #fff; }
  .buttons button.chosen small { color: #ddd; }
  .sub { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .sub button { min-height: 2.6rem; font-size: 0.9rem; background: #eee; }
  .status { font-size: 0.85rem; color: #555; text-align: center; min-height: 1.5em; }
  .start { display: flex; flex-direction: column; gap: 8px; }
  .start button, .start select, .start input { font: inherit; min-height: 2.75rem; }
  details { font-size: 0.85rem; color: #444; }
  kbd { border: 1px solid #aaa; border-radius: 3px; padding: 0 4px; font-size: 0.8em; }
  pre { white-space: pre-wrap; font-size: 0.8rem; background: #fff; padding: 8px; border: 1px solid #ccc; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <!-- 最初に、名前と合言葉を入れる（ブラウザに覚える） -->
  <section class="start" id="start" hidden>
    <h1>「と」のラベル付け</h1>
    <p>AI の学習のために、画像の「と」を見て、印象にいちばん近いものを選んでください。考えこまず、2〜3 秒で直感で選びます。どこのデータかは表示しません。</p>
    <label for="rater">あなたの名前（ほかの人と区別できれば、ニックネームでよい）</label>
    <input id="rater" maxlength="20" autocomplete="nickname">
    <label for="passcode" id="passcodeLabel">合言葉</label>
    <input id="passcode" autocomplete="off">
    <button id="begin">始める</button>
    <p class="status" id="startStatus" role="status"></p>
  </section>

  <section id="work" hidden>
    <header>
      <span id="who"></span>
      <span id="count"></span>
      <span><button id="change">名前を変える</button> ・ <button id="showStats">集計</button></span>
    </header>
    <h1 id="question"></h1>
    <div class="frame"><img id="img" alt="ラベルを付ける「と」"></div>
    <div class="buttons" id="classes"></div>
    <div class="sub">
      <button id="back" title="Backspace">← 1 つ戻る</button>
      <span></span>
      <span></span>
    </div>
    <div class="sub" id="special"></div>
    <p class="status" id="status" role="status"></p>
    <details>
      <summary>選び方の目安とキー操作</summary>
      <ul id="hints"></ul>
      <p>キー: 数字キーで選ぶ、<kbd>Backspace</kbd> で 1 つ戻る。付け直すと上書きされます。</p>
    </details>
    <pre id="stats" hidden></pre>
  </section>
  <footer class="status">
    画像: Google Fonts の日本語フォント（OFL など）、
    <a href="http://codh.rois.ac.jp/kmnist/">KMNIST データセット</a>（CODH 作成。『日本古典籍くずし字データセット』（国文研ほか所蔵）を翻案。CC BY-SA 4.0）
  </footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
let config, rater, passcode = "", current = null, shownAt = 0;
// 「1 つ戻る」のための、このページで付けた画像の並び
const seen = [];
// 戻って付け直している間は、その画像の id（付け直したら次の新しい画像へ）
let revisiting = false;

function storageGet(key) { try { return localStorage.getItem(key); } catch { return null; } }
function storageSet(key, value) { try { localStorage.setItem(key, value); } catch { /* 覚えられなくても続ける */ } }

class Unauthorized extends Error {}

async function api(path, body) {
  const headers = { "X-Label-Passcode": passcode };
  const init = body
    ? { method: "POST", headers: { ...headers, "Content-Type": "application/json" }, body: JSON.stringify(body) }
    : { headers };
  const res = await fetch("/api/label" + path, init);
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) throw new Unauthorized(data.detail || "合言葉が違います");
  if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : res.status);
  return data;
}

function allChoices() { return [...config.classes, ...config.special]; }

function render(item, chosen) {
  current = item;
  document.querySelectorAll("[data-key]").forEach((b) => b.classList.toggle("chosen", b.dataset.key === chosen));
  if (!item) {
    $("img").removeAttribute("src");
    $("status").textContent = "あなたの分は、すべて付け終わりました。ありがとうございました。";
    return;
  }
  $("img").src = item.image;
  shownAt = performance.now();
}

async function loadNext() {
  revisiting = false;
  const skip = current ? current.id : "";
  const data = await api(`/next?rater=${encodeURIComponent(rater)}&skip=${encodeURIComponent(skip)}`);
  $("count").textContent = `付けた数 ${data.done_by_me} ・ 残り ${data.remaining_for_me}`;
  render(data.item, null);
  $("status").textContent = "";
}

async function choose(key) {
  if (!current) return;
  const item = current;
  try {
    await api("/labels", { rater, item_id: item.id, label: key, ms: Math.round(performance.now() - shownAt) });
  } catch (e) {
    if (e instanceof Unauthorized) { showStart(e.message); return; }
    $("status").textContent = `記録できませんでした（${e.message}）。もう一度押してください。`;
    return;
  }
  if (!revisiting) seen.push(item.id);
  await loadNext();
}

async function back() {
  if (!seen.length) return;
  const id = revisiting ? seen[seen.indexOf(current.id) - 1] : seen[seen.length - 1];
  if (!id) return;
  const data = await api(`/mine?rater=${encodeURIComponent(rater)}&item_id=${encodeURIComponent(id)}`);
  revisiting = true;
  render(data.item, data.label);
  $("status").textContent = "前の画像です。選び直すと上書きします。";
}

function buildButtons() {
  $("question").textContent = config.question;
  $("classes").innerHTML = "";
  config.classes.forEach((c, i) => {
    const b = document.createElement("button");
    b.dataset.key = c.key;
    b.innerHTML = `${i + 1}. ${c.label}<small>${c.hint}</small>`;
    b.onclick = () => choose(c.key);
    $("classes").append(b);
  });
  $("special").innerHTML = "";
  config.special.forEach((c, i) => {
    const b = document.createElement("button");
    b.dataset.key = c.key;
    b.textContent = `${config.classes.length + i + 1}. ${c.label}`;
    b.title = c.hint;
    b.onclick = () => choose(c.key);
    $("special").append(b);
  });
  $("hints").innerHTML = allChoices().map((c) => `<li><b>${c.label}</b>: ${c.hint}</li>`).join("");
}

function showStart(message) {
  $("work").hidden = true;
  $("start").hidden = false;
  $("rater").value = rater || "";
  $("passcode").value = passcode;
  $("startStatus").textContent = message || "";
}

async function startWork() {
  $("start").hidden = true;
  $("work").hidden = false;
  $("who").textContent = rater;
  try {
    await loadNext();
  } catch (e) {
    if (e instanceof Unauthorized) { showStart(e.message); return; }
    $("status").textContent = `読み込めませんでした（${e.message}）`;
  }
}

async function init() {
  config = await api("/config");
  buildButtons();
  $("passcode").hidden = $("passcodeLabel").hidden = !config.passcode_required;
  rater = storageGet("ito.label.rater") || "";
  passcode = storageGet("ito.label.passcode") || "";
  if (rater) { startWork(); return; }
  showStart("");
}

$("begin").onclick = () => {
  rater = $("rater").value.trim();
  passcode = $("passcode").value.trim();
  if (!rater) { $("startStatus").textContent = "名前を入れてください"; return; }
  storageSet("ito.label.rater", rater);
  storageSet("ito.label.passcode", passcode);
  startWork();
};
$("change").onclick = () => showStart("");
$("back").onclick = back;
$("showStats").onclick = async () => {
  const el = $("stats");
  el.hidden = !el.hidden;
  if (!el.hidden) el.textContent = JSON.stringify(await api("/stats"), null, 2);
};
document.addEventListener("keydown", (e) => {
  if ($("work").hidden) return;
  const n = Number(e.key);
  if (n >= 1 && n <= allChoices().length) choose(allChoices()[n - 1].key);
  if (e.key === "Backspace") { e.preventDefault(); back(); }
});
init().catch((e) => { document.body.textContent = `サーバーにつながりません（${e.message}）`; });
</script>
</body>
</html>
